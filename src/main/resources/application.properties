spring.application.name=employee-mcp-client

server.port=8081

# MCP server connection
spring.ai.mcp.client.sse.connections.employee-server.url=http://localhost:8080
spring.ai.mcp.client.sse.connections.employee-server.sse-endpoint=/sse

# Gemini configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
